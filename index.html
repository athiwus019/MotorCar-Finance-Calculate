<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>โปรแกรมคำนวณจัดไฟแนนซ์รถยนต์ / รถมอเตอร์ไซค์ (รวม VAT)</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <!-- Google Fonts (Sarabun) -->
    <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Sarabun', 'sans-serif'],
                    },
                    colors: {
                        primary: {
                            50: '#f0f9ff',
                            100: '#e0f2fe',
                            500: '#0284c7',
                            600: '#0369a1',
                            700: '#095196',
                        }
                    }
                }
            }
        }
    </script>
    <style>
        @media print {
            .no-print {
                display: none !important;
            }
            body {
                background-color: white !important;
            }
            .print-card {
                box-shadow: none !important;
                border: 1px solid #e5e7eb !important;
            }
        }
        /* Custom scrollbar for schedule table */
        .custom-scrollbar::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        .custom-scrollbar::-webkit-scrollbar-track {
            background: #f1f1f1;
            border-radius: 4px;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 4px;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover {
            background: #94a3b8;
        }
    </style>
</head>
<body class="bg-slate-50 font-sans text-slate-800 min-h-screen flex flex-col justify-between" onload="initCalculator()">

    <!-- Header / Navbar -->
    <header class="bg-gradient-to-r from-slate-900 via-sky-900 to-slate-900 text-white shadow-lg no-print">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-5">
            <div class="flex items-center justify-between">
                <div class="flex items-center space-x-3">
                    <div class="p-3 bg-sky-500/20 rounded-xl border border-sky-400/30 backdrop-blur-md">
                        <i class="fa-solid fa-car text-2xl text-sky-400"></i>
                    </div>
                    <div>
                        <h1 class="text-xl sm:text-2xl font-bold tracking-tight">คำนวณค่างวดจัดไฟแนนซ์รถยนต์-มอเตอร์ไซค์</h1>
                        <p class="text-xs sm:text-sm text-sky-200">Car & Motorcycle Finance Calculator (VAT Inclusive)</p>
                    </div>
                </div>
                <div class="hidden md:flex items-center space-x-2 text-xs bg-slate-800/60 px-3 py-1.5 rounded-full border border-slate-700">
                    <i class="fa-solid fa-shield-halved text-emerald-400"></i>
                    <span>คำนวณตามมาตรฐานไฟแนนซ์ + VAT</span>
                </div>
            </div>
        </div>
    </header>

    <!-- Main Content Container -->
    <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8 flex-grow w-full">
        <div class="grid grid-cols-1 lg:grid-cols-12 gap-8">
            
            <!-- Left Column: Input Form -->
            <div class="lg:col-span-5 space-y-6 no-print">
                <div class="bg-white rounded-2xl shadow-sm border border-slate-200/80 p-6 transition-all duration-300 hover:shadow-md">
                    <h2 class="text-lg font-bold text-slate-800 border-b border-slate-100 pb-3 mb-5 flex items-center">
                        <i class="fa-solid fa-sliders text-sky-600 mr-2.5"></i>
                        ข้อมูลการจัดไฟแนนซ์
                    </h2>

                    <form id="calcForm" onsubmit="event.preventDefault(); calculateLoan();" class="space-y-4">
                        
                        <!-- Vehicle Type Selector -->
                        <div>
                            <label class="block text-sm font-semibold text-slate-700 mb-1.5">
                                ประเภทรถ <span class="text-rose-500">*</span>
                            </label>
                            <div class="grid grid-cols-2 gap-3">
                                <label class="cursor-pointer">
                                    <input type="radio" name="vehicleType" value="car" checked onchange="onVehicleTypeChange()" class="peer sr-only">
                                    <div class="p-3 text-center rounded-xl border border-slate-200 bg-slate-50 peer-checked:bg-sky-50 peer-checked:border-sky-500 peer-checked:text-sky-700 font-semibold text-sm transition-all flex items-center justify-center space-x-2">
                                        <i class="fa-solid fa-car text-lg"></i>
                                        <span>รถยนต์</span>
                                    </div>
                                </label>
                                <label class="cursor-pointer">
                                    <input type="radio" name="vehicleType" value="motorcycle" onchange="onVehicleTypeChange()" class="peer sr-only">
                                    <div class="p-3 text-center rounded-xl border border-slate-200 bg-slate-50 peer-checked:bg-sky-50 peer-checked:border-sky-500 peer-checked:text-sky-700 font-semibold text-sm transition-all flex items-center justify-center space-x-2">
                                        <i class="fa-solid fa-motorcycle text-lg"></i>
                                        <span>มอเตอร์ไซค์</span>
                                    </div>
                                </label>
                            </div>
                        </div>

                        <!-- Vehicle Price -->
                        <div>
                            <label class="block text-sm font-semibold text-slate-700 mb-1.5">
                                ราคารถ (บาท) <span class="text-rose-500">*</span>
                            </label>
                            <div class="relative rounded-xl shadow-sm">
                                <div class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-slate-400">
                                    <i class="fa-solid fa-baht-sign"></i>
                                </div>
                                <input type="number" id="vehiclePrice" value="65000" min="0" step="any" required oninput="updateDownAmount()"
                                    class="block w-full pl-10 pr-4 py-2.5 bg-slate-50 border border-slate-300 rounded-xl focus:ring-2 focus:ring-sky-500 focus:border-sky-500 text-slate-800 text-base transition-all font-medium"
                                    placeholder="เช่น 800,000">
                            </div>
                        </div>

                        <!-- Down Payment -->
                        <div>
                            <div class="flex items-center justify-between mb-1.5">
                                <label class="text-sm font-semibold text-slate-700">
                                    เงินดาวน์ <span class="text-rose-500">*</span>
                                </label>
                                <span class="text-xs text-sky-600 font-semibold" id="downAmountText">คิดเป็นเงิน 13,000 บาท</span>
                            </div>
                            <div class="grid grid-cols-3 gap-2">
                                <div class="col-span-2 relative rounded-xl shadow-sm">
                                    <div class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-slate-400" id="downPrefixIcon">
                                        <i class="fa-solid fa-percent"></i>
                                    </div>
                                    <input type="number" id="downPaymentValue" value="20" min="0" step="any" required oninput="updateDownAmount()"
                                        class="block w-full pl-10 pr-4 py-2.5 bg-slate-50 border border-slate-300 rounded-xl focus:ring-2 focus:ring-sky-500 focus:border-sky-500 text-slate-800 text-base transition-all font-medium">
                                </div>
                                <div class="col-span-1">
                                    <select id="downPaymentType" onchange="onDownTypeChange()"
                                        class="block w-full px-3 py-2.5 bg-slate-50 border border-slate-300 rounded-xl focus:ring-2 focus:ring-sky-500 focus:border-sky-500 text-slate-700 text-sm font-medium transition-all">
                                        <option value="percent" selected>เปอร์เซ็นต์ (%)</option>
                                        <option value="baht">บาท (฿)</option>
                                    </select>
                                </div>
                            </div>
                        </div>

                        <!-- Finance Amount (Readonly) -->
                        <div>
                            <label class="block text-sm font-semibold text-slate-600 mb-1">ยอดจัดไฟแนนซ์ (เงินกู้):</label>
                            <div class="text-xl font-bold text-slate-800 bg-slate-100/80 px-4 py-2.5 rounded-xl border border-slate-200" id="financeAmountDisplay">
                                52,000.00 บาท
                            </div>
                        </div>

                        <!-- Interest Type Selector -->
                        <div>
